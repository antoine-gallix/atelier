- name: Deploy resume
  hosts: atelier
  tasks:
    - name: Sync resume
      ansible.posix.synchronize:
        src: ~/Documents/resume/build/
        dest: /srv/www/resume/
        delete: true

    - name: Install resume site config
      become: true
      ansible.builtin.copy:
        src: resume.caddyfile
        dest: /etc/caddy/Caddyfile.d/resume.caddyfile
        mode: "0644"
        validate: caddy validate --adapter caddyfile --config %s
      notify: Reload caddy

  handlers:
    - name: Reload caddy
      become: true
      ansible.builtin.systemd_service:
        name: caddy
        state: reloaded
